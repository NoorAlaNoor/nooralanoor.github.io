<style>
:root{--bg:#fbfaf6;--ink:#1d2430;--muted:#5d6675;--line:#e3dfd2;--accent:#8a6a12;--card:#fff;--fill:#ffe98a}
@media (prefers-color-scheme:dark){:root{--bg:#06182d;--ink:#e8edf5;--muted:#a3afc2;--line:#1d3350;--accent:#e2b94a;--card:#0c2340;--fill:#6b5410}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.25rem 1rem 3rem}
nav.langs{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.25rem}
nav.langs a{padding:.35rem .9rem;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--card)}
nav.langs a.on{border-color:var(--accent);color:var(--accent);font-weight:600}
h1{font-size:1.65rem;line-height:1.25;margin:.25rem 0 .25rem}
h2{font-size:1.1rem;margin:1.75rem 0 .4rem;color:var(--accent)}
p.meta{color:var(--muted);margin:0 0 1rem;font-size:.92rem}
section.lang{border-top:1px solid var(--line);padding-top:1.25rem;margin-top:1.25rem}
section.lang:first-of-type{border-top:0;margin-top:0;padding-top:0}
ul{padding-inline-start:1.3rem}li{margin:.3rem 0}
a{color:var(--accent)}
mark.fill{background:var(--fill);color:inherit;padding:0 .2em;border-radius:.2em}
#draft{display:none;background:var(--fill);border-radius:.6rem;padding:.7rem .9rem;margin:0 0 1.25rem;font-size:.92rem}
ul{list-style:none;padding:0}li{margin:.9rem 0;font-size:1.1rem}</style>
